version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lifeshelf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifeshelf
      POSTGRES_PASSWORD: lifeshelf_secret
      POSTGRES_DB: lifeshelf_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeshelf -d lifeshelf_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeshelf-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://lifeshelf:lifeshelf_secret@postgres:5432/lifeshelf_db?schema=public
      JWT_SECRET: super_secret_jwt_key_lifeshelf_production_ready_at_least_32_characters_long
      JWT_EXPIRES_IN: 7d
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CORS_ORIGIN: "*"

volumes:
  postgres_data:
    driver: local
